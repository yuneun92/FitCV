name: CI
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [ "3.12" ]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install uv
        run: |
          python -m pip install --upgrade pip
          pip install uv

      - name: Install dev tools (ruff, pytest)
        run: |
          uv pip install -U ruff pytest

      - name: Lint (ruff)
        run: |
          uv run ruff check .

      - name: Test (pytest)
        run: |
          uv run pytest -q 